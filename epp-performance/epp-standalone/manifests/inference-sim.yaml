apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-sim
  labels:
    app: inference-sim
    llm-d.ai/guide: optimized-baseline
spec:
  replicas: 4
  selector:
    matchLabels:
      app: inference-sim
      llm-d.ai/guide: optimized-baseline
  template:
    metadata:
      labels:
        app: inference-sim
        llm-d.ai/guide: optimized-baseline
    spec:
      nodeSelector:
        role: simulator
      containers:
        - name: inference-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
          args:
            - "--model"
            - "Qwen/Qwen3-32B"
            - "--port"
            - "8000"
            - "--max-num-seqs"
            - "2048"
            - "--max-model-len"
            - "131072"
            - "--time-to-first-token"
            - "1ms"
            - "--inter-token-latency"
            - "10ms"
            - "--mode"
            - "random"
            - "--force-dummy-tokenizer"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference-sim
  labels:
    app: inference-sim
    llm-d.ai/guide: optimized-baseline
spec:
  selector:
    app: inference-sim
    llm-d.ai/guide: optimized-baseline
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inference-sim-metrics
  labels:
    app: inference-sim
spec:
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
  selector:
    matchLabels:
      app: inference-sim
