apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: sim-llm
  namespace: llm-d-perf-investigation
  annotations:
    security.opendatahub.io/enable-auth: "false"
spec:
  replicas: 4
  router:
    scheduler:
      template:
        nodeSelector:
          role: epp
    route:
      http: {}
    gateway:
      refs:
        - name: openshift-ai-inference
          namespace: openshift-ingress
  model:
    name: simulated-llama-3
    uri: hf://simulated-llama-3
  storageInitializer:
    enabled: false
  template:
    nodeSelector:
      role: simulator
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:latest
        command:
          - /app/llm-d-inference-sim
        args:
          - --port=8000
          - --model=simulated-llama-3
          - --max-num-seqs
          - "2048"
          - --max-model-len
          - "8192"
          - --time-to-first-token
          - 1ms
          - --inter-token-latency
          - 10ms
          - --mode
          - random
          - --logtostderr=true
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        ports:
          - containerPort: 8000
            name: http1
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 2
          periodSeconds: 5
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
