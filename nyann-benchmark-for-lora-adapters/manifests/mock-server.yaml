---
# Mock server deployment - simulates an OpenAI-compatible LLM endpoint
# Accepts any model name, useful for testing multi-LoRA routing scenarios
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-server
  namespace: nyann-bench
  labels:
    app: mock-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-server
  template:
    metadata:
      labels:
        app: mock-server
    spec:
      containers:
        - name: mock-server
          image: ghcr.io/neuralmagic/nyann-bench:latest
          imagePullPolicy: Always
          args:
            - "mock-server"
            - "--addr=:8000"
            - "--ttft=10ms"      # Time to first token
            - "--itl=2ms"        # Inter-token latency  
            - "--output-tokens=64"
            - "--model=mock-model"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-server
  namespace: nyann-bench
  labels:
    app: mock-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: mock-server
