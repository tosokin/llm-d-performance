---
# Mock server deployment - SCALED for 1000 concurrent connections
# 4 replicas to handle the load
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-server
  namespace: nyann-bench
  labels:
    app: mock-server
spec:
  replicas: 4  # Scaled up for 1000 connections
  selector:
    matchLabels:
      app: mock-server
  template:
    metadata:
      labels:
        app: mock-server
    spec:
      containers:
        - name: mock-server
          image: ghcr.io/neuralmagic/nyann-bench:latest
          imagePullPolicy: Always
          args:
            - "mock-server"
            - "--addr=:8000"
            - "--ttft=2ms"       # Faster for high concurrency
            - "--itl=500us"      # 500 microseconds
            - "--output-tokens=32"
            - "--model=mock-model"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: "256Mi"
            limits:
              cpu: "4"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-server
  namespace: nyann-bench
  labels:
    app: mock-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: mock-server
