---
# VERTICAL SCALING: Single pod, single container, 1000 workers
# Each worker targets a DIFFERENT LoRA adapter simultaneously
#
# Worker 0 → lora-adapter-0
# Worker 1 → lora-adapter-1
# ...
# Worker 999 → lora-adapter-999
#
# All 1000 adapters hit SIMULTANEOUSLY from a single container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nyann-vertical-1000-config
  namespace: nyann-bench
data:
  run-workers.sh: |
    #!/bin/sh
    set -e
    
    TARGET="${TARGET:-http://mock-server.nyann-bench.svc.cluster.local:8000/v1}"
    NUM_WORKERS="${NUM_WORKERS:-1000}"
    CONCURRENCY="${CONCURRENCY:-1}"
    DURATION="${DURATION:-60s}"
    OUTPUT_BASE="/tmp/results"
    
    mkdir -p "$OUTPUT_BASE"
    ulimit -n 65536 2>/dev/null || true
    
    echo "=== nyann-bench Vertical Scaling ($NUM_WORKERS Workers) ==="
    echo "Target: $TARGET"
    echo "Workers: $NUM_WORKERS, Concurrency: $CONCURRENCY, Duration: $DURATION"
    echo ""
    
    # Start workers in batches
    BATCH_SIZE=20
    for batch_start in $(seq 0 $BATCH_SIZE $((NUM_WORKERS - 1))); do
        batch_end=$((batch_start + BATCH_SIZE - 1))
        if [ $batch_end -ge $NUM_WORKERS ]; then
            batch_end=$((NUM_WORKERS - 1))
        fi
        
        echo "Starting workers $batch_start-$batch_end..."
        
        for i in $(seq $batch_start $batch_end); do
            ADAPTER="lora-adapter-${i}"
            mkdir -p "$OUTPUT_BASE/worker_$i"
            
            nyann-bench generate \
                --target "$TARGET" \
                --model "$ADAPTER" \
                --worker-id 0 \
                --config "{\"load\":{\"concurrency\":$CONCURRENCY,\"duration\":\"$DURATION\"},\"workload\":{\"type\":\"faker\",\"isl\":64,\"osl\":32}}" \
                --output-dir "$OUTPUT_BASE/worker_$i" \
                > "$OUTPUT_BASE/worker_$i/output.log" 2>&1 &
        done
        
        sleep 2
    done
    
    echo ""
    echo "All $NUM_WORKERS workers started. Waiting for completion..."
    wait
    
    # Count results
    SUCCESS=0
    FAILED=0
    for i in $(seq 0 $((NUM_WORKERS - 1))); do
        if [ -f "$OUTPUT_BASE/worker_$i/timestamps_0.json" ]; then
            SUCCESS=$((SUCCESS + 1))
        else
            FAILED=$((FAILED + 1))
        fi
    done
    
    echo ""
    echo "=== Results ==="
    echo "Successful: $SUCCESS, Failed: $FAILED"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nyann-vertical-1000
  namespace: nyann-bench
  labels:
    app: nyann-vertical-1000
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: nyann-vertical-1000
    spec:
      restartPolicy: Never
      containers:
        - name: workers
          image: quay.io/rh-ee-tosokin/nyann-bench-shell:latest
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["/scripts/run-workers.sh"]
          env:
            - name: TARGET
              value: "http://mock-server.nyann-bench.svc.cluster.local:8000/v1"
            - name: NUM_WORKERS
              value: "1000"
            - name: CONCURRENCY
              value: "1"
            - name: DURATION
              value: "60s"
          resources:
            requests:
              cpu: "32"
              memory: "32Gi"
            limits:
              cpu: "64"
              memory: "48Gi"
          securityContext:
            # Allow more processes
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: nyann-vertical-1000-config
            defaultMode: 0755
